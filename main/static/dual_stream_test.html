<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双摄像头视频流测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .video-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-box {
            width: 45%;
            min-width: 300px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .video-header {
            background-color: #2196F3;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .video-frame {
            padding: 10px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee;
            min-height: 360px;
        }
        .video-stream {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .placeholder {
            color: #777;
            text-align: center;
            font-size: 16px;
            padding: 40px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .start-btn {
            background-color: #4CAF50;
            color: white;
        }
        .start-btn:hover {
            background-color: #45a049;
        }
        .stop-btn {
            background-color: #f44336;
            color: white;
        }
        .stop-btn:hover {
            background-color: #d32f2f;
        }
        .reset-btn {
            background-color: #ff9800;
            color: white;
        }
        .reset-btn:hover {
            background-color: #fb8c00;
        }
        button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .log {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .error {
            color: #f44336;
        }
        .success {
            color: #4CAF50;
        }
        .info {
            color: #2196F3;
        }
        @media (max-width: 768px) {
            .video-box {
                width: 100%;
            }
            button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>双摄像头视频流测试</h1>
    
    <div class="controls">
        <button id="startBtn" class="start-btn">启动特征点检测器</button>
        <button id="stopBtn" class="stop-btn" disabled>停止特征点检测器</button>
        <button id="startTrackerBtn" class="start-btn">启动特征点追踪器</button>
        <button id="stopTrackerBtn" class="stop-btn" disabled>停止特征点追踪器</button>
        <button id="resetBtn" class="reset-btn">重置状态</button>
    </div>
    
    <div class="video-container">
        <div class="video-box">
            <div class="video-header">特征点检测器 - 左摄像头</div>
            <div class="video-frame" id="detectorLeftFrame">
                <div class="placeholder">视频流未启动</div>
            </div>
        </div>
        <div class="video-box">
            <div class="video-header">特征点检测器 - 右摄像头</div>
            <div class="video-frame" id="detectorRightFrame">
                <div class="placeholder">视频流未启动</div>
            </div>
        </div>
    </div>
    
    <div class="video-container">
        <div class="video-box">
            <div class="video-header">特征点追踪器 - 左摄像头</div>
            <div class="video-frame" id="trackerLeftFrame">
                <div class="placeholder">视频流未启动</div>
            </div>
        </div>
        <div class="video-box">
            <div class="video-header">特征点追踪器 - 右摄像头</div>
            <div class="video-frame" id="trackerRightFrame">
                <div class="placeholder">视频流未启动</div>
            </div>
        </div>
    </div>
    
    <div class="status">
        <div>状态: <span id="statusText">未启动</span></div>
        <div class="log" id="logContainer"></div>
    </div>
    
    <script>
        // 服务器地址
        const serverUrl = "http://127.0.0.1:5000";
        
        // 获取DOM元素
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const startTrackerBtn = document.getElementById('startTrackerBtn');
        const stopTrackerBtn = document.getElementById('stopTrackerBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');
        const logContainer = document.getElementById('logContainer');
        
        // 视频帧容器
        const detectorLeftFrame = document.getElementById('detectorLeftFrame');
        const detectorRightFrame = document.getElementById('detectorRightFrame');
        const trackerLeftFrame = document.getElementById('trackerLeftFrame');
        const trackerRightFrame = document.getElementById('trackerRightFrame');
        
        // 状态
        let detectorActive = false;
        let trackerActive = false;
        
        // 添加日志条目
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // 更新UI状态
        function updateUIState() {
            startBtn.disabled = detectorActive;
            stopBtn.disabled = !detectorActive;
            startTrackerBtn.disabled = trackerActive;
            stopTrackerBtn.disabled = !trackerActive;
            
            if (detectorActive && trackerActive) {
                statusText.textContent = '特征点检测器和追踪器运行中';
            } else if (detectorActive) {
                statusText.textContent = '特征点检测器运行中';
            } else if (trackerActive) {
                statusText.textContent = '特征点追踪器运行中';
            } else {
                statusText.textContent = '未启动';
            }
        }
        
        // 启动特征点检测器
        async function startDetector() {
            try {
                addLog('正在启动特征点检测器...');
                const response = await fetch(`${serverUrl}/f_detector/start_cameras`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    detectorActive = true;
                    updateUIState();
                    addLog(data.message, 'success');
                    loadDetectorStreams();
                } else {
                    addLog(`启动失败: ${data.message}`, 'error');
                }
            } catch (error) {
                addLog(`启动失败: ${error.message}`, 'error');
            }
        }
        
        // 停止特征点检测器
        async function stopDetector() {
            try {
                addLog('正在停止特征点检测器...');
                const response = await fetch(`${serverUrl}/f_detector/stop_cameras`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    detectorActive = false;
                    updateUIState();
                    addLog(data.message, 'success');
                    unloadDetectorStreams();
                } else {
                    addLog(`停止失败: ${data.message}`, 'error');
                }
            } catch (error) {
                addLog(`停止失败: ${error.message}`, 'error');
            }
        }
        
        // 启动特征点追踪器
        async function startTracker() {
            try {
                addLog('正在启动特征点追踪器...');
                const response = await fetch(`${serverUrl}/f_tracker/start_cameras`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    trackerActive = true;
                    updateUIState();
                    addLog(data.message, 'success');
                    loadTrackerStreams();
                } else {
                    addLog(`启动失败: ${data.message}`, 'error');
                }
            } catch (error) {
                addLog(`启动失败: ${error.message}`, 'error');
            }
        }
        
        // 停止特征点追踪器
        async function stopTracker() {
            try {
                addLog('正在停止特征点追踪器...');
                const response = await fetch(`${serverUrl}/f_tracker/stop_cameras`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    trackerActive = false;
                    updateUIState();
                    addLog(data.message, 'success');
                    unloadTrackerStreams();
                } else {
                    addLog(`停止失败: ${data.message}`, 'error');
                }
            } catch (error) {
                addLog(`停止失败: ${error.message}`, 'error');
            }
        }
        
        // 重置状态
        function resetState() {
            if (detectorActive) stopDetector();
            if (trackerActive) stopTracker();
            
            setTimeout(() => {
                unloadDetectorStreams();
                unloadTrackerStreams();
                addLog('状态已重置', 'info');
            }, 500);
        }
        
        // 加载检测器视频流
        function loadDetectorStreams() {
            // 清除占位符
            detectorLeftFrame.innerHTML = '';
            detectorRightFrame.innerHTML = '';
            
            // 创建左摄像头图像
            const leftImg = document.createElement('img');
            leftImg.className = 'video-stream';
            leftImg.src = `${serverUrl}/f_detector/video_feed_left?t=${Date.now()}`;
            leftImg.onerror = () => {
                console.error('左侧检测器视频流加载失败');
                setTimeout(() => {
                    // 尝试重新加载
                    leftImg.src = `${serverUrl}/f_detector/video_feed_left?t=${Date.now()}`;
                }, 2000);
            };
            detectorLeftFrame.appendChild(leftImg);
            
            // 创建右摄像头图像
            const rightImg = document.createElement('img');
            rightImg.className = 'video-stream';
            rightImg.src = `${serverUrl}/f_detector/video_feed_right?t=${Date.now()}`;
            rightImg.onerror = () => {
                console.error('右侧检测器视频流加载失败');
                setTimeout(() => {
                    // 尝试重新加载
                    rightImg.src = `${serverUrl}/f_detector/video_feed_right?t=${Date.now()}`;
                }, 2000);
            };
            detectorRightFrame.appendChild(rightImg);
            
            addLog('检测器视频流已加载', 'info');
        }
        
        // 卸载检测器视频流
        function unloadDetectorStreams() {
            detectorLeftFrame.innerHTML = '<div class="placeholder">视频流未启动</div>';
            detectorRightFrame.innerHTML = '<div class="placeholder">视频流未启动</div>';
        }
        
        // 加载追踪器视频流
        function loadTrackerStreams() {
            // 清除占位符
            trackerLeftFrame.innerHTML = '';
            trackerRightFrame.innerHTML = '';
            
            // 创建左摄像头图像
            const leftImg = document.createElement('img');
            leftImg.className = 'video-stream';
            leftImg.src = `${serverUrl}/f_tracker/video_feed_left?t=${Date.now()}`;
            leftImg.onerror = () => {
                console.error('左侧追踪器视频流加载失败');
                setTimeout(() => {
                    // 尝试重新加载
                    leftImg.src = `${serverUrl}/f_tracker/video_feed_left?t=${Date.now()}`;
                }, 2000);
            };
            trackerLeftFrame.appendChild(leftImg);
            
            // 创建右摄像头图像
            const rightImg = document.createElement('img');
            rightImg.className = 'video-stream';
            rightImg.src = `${serverUrl}/f_tracker/video_feed_right?t=${Date.now()}`;
            rightImg.onerror = () => {
                console.error('右侧追踪器视频流加载失败');
                setTimeout(() => {
                    // 尝试重新加载
                    rightImg.src = `${serverUrl}/f_tracker/video_feed_right?t=${Date.now()}`;
                }, 2000);
            };
            trackerRightFrame.appendChild(rightImg);
            
            addLog('追踪器视频流已加载', 'info');
        }
        
        // 卸载追踪器视频流
        function unloadTrackerStreams() {
            trackerLeftFrame.innerHTML = '<div class="placeholder">视频流未启动</div>';
            trackerRightFrame.innerHTML = '<div class="placeholder">视频流未启动</div>';
        }
        
        // 绑定事件监听器
        startBtn.addEventListener('click', startDetector);
        stopBtn.addEventListener('click', stopDetector);
        startTrackerBtn.addEventListener('click', startTracker);
        stopTrackerBtn.addEventListener('click', stopTracker);
        resetBtn.addEventListener('click', resetState);
        
        // 初始化
        addLog('页面已加载，等待操作', 'info');
        updateUIState();
        
        // 页面关闭时清理资源
        window.addEventListener('beforeunload', () => {
            if (detectorActive || trackerActive) {
                // 尝试停止所有摄像头
                fetch(`${serverUrl}/f_detector/stop_cameras`, { method: 'POST' });
                fetch(`${serverUrl}/f_tracker/stop_cameras`, { method: 'POST' });
            }
        });
    </script>
</body>
</html>
